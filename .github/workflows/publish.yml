# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted publishing (OIDC), so
# no npm token is stored in this repository. Configure it once on npmjs.com:
# lilac-sdk -> Settings -> Trusted publishing -> GitHub Actions, this repo, workflow publish.yml.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
